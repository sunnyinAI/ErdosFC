[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erdos-fc"
version = "0.1.0"
description = "Erdos Federated Computing — a lightweight, extensible runtime for federated learning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sunny Gupta", email = "sunnygupta@iitb.ac.in" }]
keywords = [
    "federated-learning",
    "distributed-deep-learning",
    "privacy-preserving-ml",
    "decentralized-ai",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
# Everything needed to run the bundled examples.
torch = ["torch>=2.0", "torchvision>=0.15"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/sunnyinAI/ErdosComputing"
Author = "https://sunnyinai.github.io"

[tool.setuptools.packages.find]
include = ["erdos*"]
exclude = ["examples*", "docs*", "web*"]
