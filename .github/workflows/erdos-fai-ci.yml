name: Erdos-FAI CI

on:
  push:
    branches: [main]
    paths:
      - "erdos-fai/**"
      - ".github/workflows/erdos-fai-ci.yml"
  pull_request:
    paths:
      - "erdos-fai/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: erdos-fai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test the demo (offline)
        run: erdos-fai demo
