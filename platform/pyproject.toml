[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erdos-platform"
version = "0.1.0"
description = "Erdos Platform — enterprise agentic technology: composable agent cards, multi-agent orchestration, human-in-the-loop safety, continual learning, and real-time observability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sunny Gupta" }]
keywords = [
    "agents",
    "agentic-ai",
    "llm",
    "agent-orchestration",
    "human-in-the-loop",
    "observability",
    "claude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core framework is dependency-light — pure standard library.
dependencies = []

[project.optional-dependencies]
# Run agents on Claude via the official SDK.
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
erdos-platform = "erdos_platform.cli:main"

[project.urls]
Homepage = "https://github.com/sunnyinAI/ErdosComputing"

[tool.setuptools.packages.find]
include = ["erdos_platform*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
